[bar/main]
width = 100%
height = 18pt
bottom = true
background = #1e1e2e
foreground = #cdd6f4

; Your custom readable font
font-0 = "ComicShannsMono Nerd Font:size=9;1"

modules-left = i3
modules-center = date
modules-right = tray fs memory cpu wlan eth pulseaudio battery

module-margin = 1
padding-right = 2

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
label-focused = %name%
label-focused-foreground = #89b4fa
label-focused-padding = 1
label-visible = %name%
label-visible-foreground = #a6adc8
label-visible-padding = 1

[module/fs]
type = internal/fs
mount-0 = /
interval = 30
warn-percentage = 90

label-mounted = 󰋊 %free%
format-warn = <label-warn>
label-warn = 󰋊 %free%
label-warn-foreground = #f38ba8

[module/tray]
type = internal/tray
tray-spacing = 8pt
tray-padding = 2

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 90
format = <label>
label = 󰍛 %free%
format-warn = <label-warn>
label-warn = 󰍛 %free%
label-warn-foreground = #f38ba8

[module/cpu]
type = internal/cpu
interval = 1
warn-percentage = 85
format = <label>
label = 󰻠 %percentage%%
format-warn = <label-warn>
label-warn = 󰻠 %percentage%%
label-warn-foreground = #f38ba8

[module/wlan]
type = internal/network
interface-type = wireless
label-connected =  %essid%
label-disconnected = 󰖪 Off
label-disconnected-foreground = #f38ba8

[module/eth]
type = internal/network
interface-type = wired
label-connected = 󰈀 Active
label-disconnected = 󰈂 Off
label-disconnected-foreground = #f38ba8

[module/pulseaudio]
type = internal/pulseaudio
label-volume = 󰕾 %percentage%%
label-muted = 󰖁 Muted
label-muted-foreground = #7f849c
click-right = ghostty --title="Audio Settings" -e pulsemixer

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
low-at = 20
label-charging = 󰂄 %percentage%%
label-discharging = 󰁹 %percentage%%
label-full = 󰁹 100%
format-low = <label-low>
label-low = 󰂃 %percentage%%
label-low-foreground = #f38ba8

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%
