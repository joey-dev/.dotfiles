name: NixOS Configuration Validation
run-name: Validate NixOS flake and home-manager configuration
on:
  pull_request:
    branches:
    - nixos
jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate NixOS configuration
    permissions:
      contents: read
    steps:
      - name: checkout branch
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      
      - name: Enable flakes
        run: |
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf
      
      - name: Check flake
        run: nix flake check
      
      - name: Verify all role modules exist
        run: |
          echo "Verifying NixOS role structure..."
          for role in alacritty common docker git gtk i3 javascript neovim php sql tmux zsh; do
            if [ ! -f "roles/$role/$role.nix" ]; then
              echo "Error: roles/$role/$role.nix not found"
              exit 1
            fi
            if [ ! -d "roles/$role/configuration" ]; then
              echo "Error: roles/$role/configuration directory not found"
              exit 1
            fi
            echo "✓ $role role structure is valid"
          done
          echo "All roles validated successfully!"
      
      - name: Validate syntax of all .nix files
        run: |
          echo "Validating .nix file syntax..."
          for nixfile in $(find . -name "*.nix"); do
            echo "Checking $nixfile..."
            nix-instantiate --parse "$nixfile" > /dev/null
          done
          echo "All .nix files have valid syntax!"
      
      - name: Test home-manager build
        run: |
          echo "Building home-manager configuration..."
          echo "This verifies that the configuration can be built successfully."
          # Try to build the configuration (dry-run)
          nix build --dry-run .#homeConfigurations.user.activationPackage 2>&1 | tee build-output.log || true
          
          # Check if the build evaluation succeeded (even if packages aren't downloaded)
          if grep -q "error:" build-output.log; then
            echo "❌ Build evaluation failed. Check the errors above."
            cat build-output.log
            exit 1
          else
            echo "✅ Configuration builds successfully!"
          fi
