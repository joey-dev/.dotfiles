name: NixOS Configuration Validation
run-name: Validate NixOS flake and home-manager configuration
on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate NixOS configuration
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Builds the Home Manager config of every host, evaluates the NixOS
      # configs, and runs the nixfmt, statix,
      # deadnix and shellcheck checks defined in flake.nix
      - name: Check flake, lint and build configuration
        run: nix flake check --print-build-logs
